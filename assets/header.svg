<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#16244a"/></linearGradient>
<linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#7fb2ff"/></linearGradient></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.n{font-size:44px;font-weight:800;fill:url(#a)}.s{font-size:17px;fill:#9fb0d9}
